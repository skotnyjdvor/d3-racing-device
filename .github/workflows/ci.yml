name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: laptrace_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d laptrace_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Unit and API end-to-end tests
        env:
          TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/laptrace_ci
        run: npm test

      - name: Production build
        run: npm run build
